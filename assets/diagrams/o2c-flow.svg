<text x="384.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">見積 VA21</text>
<text x="358.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">正式な見積。有効期間を含められる</text>
