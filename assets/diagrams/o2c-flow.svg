<text x="112.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">引合 VA11</text>
<text x="86.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">得意先の引合：何を、どれだけ</text>
<text x="86.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">アウトプット：引合伝票</text>
<line x1="314.0" y1="184.0" x2="338.0" y2="184.0" stroke="#0a6ed1" stroke-width="2.0" marker-end="url(#ar)"/>
