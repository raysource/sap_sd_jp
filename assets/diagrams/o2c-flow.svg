<text x="656.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">受注伝票 VA01</text>
<text x="630.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">見積を参照して OR 受注伝票を登録</text>
<text x="630.0" y="195.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">価格設定＋所要量確認</text>
<text x="630.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">アウトプット：受注伝票</text>
<line x1="858.0" y1="184.0" x2="882.0" y2="184.0" stroke="#0a6ed1" stroke-width="2.0" marker-end="url(#ar)"/>
<rect x="886.0" y="130.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="886.0" y="130.0" width="4.5" height="108.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<circle cx="908.0" cy="152.0" r="12" fill="#0a6ed1"/><text x="908.0" y="156.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
<text x="928.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">出荷伝票 VL01N</text>
<text x="902.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">受注伝票を基準に納入伝票を作成</text>
<text x="902.0" y="195.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">出荷ポイント/保管場所を決定</text>
<text x="902.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">アウトプット：納入伝票</text>
<line x1="1130.0" y1="184.0" x2="1154.0" y2="184.0" stroke="#0a6ed1" stroke-width="2.0" marker-end="url(#ar)"/>
<rect x="1158.0" y="130.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="1158.0" y="130.0" width="4.5" height="108.0" rx="2" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<circle cx="1180.0" cy="152.0" r="12" fill="#0a6ed1"/><text x="1180.0" y="156.3" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">5</text>
<text x="1200.0" y="157.0" font-size="14.5" fill="#0854a0" text-anchor="start" font-weight="700">請求書 VF01</text>
<text x="1174.0" y="180.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">納入を参照して請求</text>
<text x="1174.0" y="226.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">アウトプット：請求書 F2</text>
<rect x="310.0" y="384.0" width="240.0" height="108.0" rx="10" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="310.0" y="384.0" width="4.5" height="108.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="326.0" y="410.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">所要量確認（ATP）</text>
<text x="326.0" y="432.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">受注保存時 / 納入作成時にチェック</text>
<text x="326.0" y="452.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">確認日 = 最も早く対応できる日付</text>
<text x="326.0" y="478.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">在庫不足でも保存可（ブロック時を除く）</text>
<rect x="582.0" y="384.0" width="300.0" height="108.0" rx="10" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="582.0" y="384.0" width="4.5" height="108.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="598.0" y="410.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">ピッキング Picking</text>
<text x="598.0" y="432.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">決定して保管場所から出庫する（ピッキング数量）</text>
<text x="598.0" y="452.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">次に「出庫過転記」：移動タイプ 601</text>
<text x="598.0" y="478.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">→ 品目伝票＋在庫減（MB1C 501 で期首在庫補充）</text>
<rect x="914.0" y="384.0" width="300.0" height="108.0" rx="10" fill="#ffffff" stroke="#007272" stroke-width="1.4"/>
<rect x="914.0" y="384.0" width="4.5" height="108.0" rx="2" fill="#007272" stroke="#007272" stroke-width="1.4"/>
<text x="930.0" y="410.0" font-size="14" fill="#007272" text-anchor="start" font-weight="700">出庫過転記の後続処理</text>
<text x="930.0" y="432.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">在庫数量と金額が同時に減少（出庫）</text>
<text x="930.0" y="452.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">納入ステータスが「完了」になり、請求可能</text>
<text x="930.0" y="478.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">原価は CO 側で表現（売上原価）</text>
