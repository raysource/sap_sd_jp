<text x="383.0" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">納入伝票</text>
<line x1="450.0" y1="834.0" x2="468.0" y2="834.0" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="472.0" y="816.0" width="67.5" height="36.0" rx="8" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.3"/>
