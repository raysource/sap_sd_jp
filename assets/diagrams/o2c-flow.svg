<rect x="640.0" y="638.0" width="340.0" height="108.0" rx="10" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.4"/>
<rect x="640.0" y="638.0" width="4.5" height="108.0" rx="2" fill="#5b3fa8" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="656.0" y="664.0" font-size="14" fill="#5b3fa8" text-anchor="start" font-weight="700">請求書の転記（リリース）VF02</text>
<text x="656.0" y="686.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">「保存 / リリース」→「転記に送信されました」</text>
<text x="656.0" y="706.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">会計伝票を生成：借方 得意先未収 / 貸方 収益 + 売上税</text>
<text x="656.0" y="732.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">勘定は VKOA + 勘定割当グループで導出される</text>
<rect x="1020.0" y="638.0" width="340.0" height="108.0" rx="10" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.4"/>
<rect x="1020.0" y="638.0" width="4.5" height="108.0" rx="2" fill="#5b3fa8" stroke="#5b3fa8" stroke-width="1.4"/>
<text x="1036.0" y="664.0" font-size="14" fill="#5b3fa8" text-anchor="start" font-weight="700">入金と消込</text>
<text x="1036.0" y="686.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">入金 → F-28 で消込（FBL5N で未消込を確認）</text>
<text x="1036.0" y="706.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">プロセスのクローズドループ：現金が戻ってくる</text>
<text x="1036.0" y="732.0" font-size="11" fill="#6b7a8d" text-anchor="start" font-weight="400">当サイトのプロセスは教材シナリオに準拠：納入 → 請求 → 転記</text>
