<line x1="541.5" y1="834.0" x2="559.5" y2="834.0" stroke="#6b7a8d" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="563.5" y="816.0" width="80.0" height="36.0" rx="8" fill="#ffffff" stroke="#5b3fa8" stroke-width="1.3"/>
<text x="578.5" y="840.0" font-size="12.5" fill="#1d2d3e" text-anchor="start" font-weight="400">会計伝票</text>
<text x="56.0" y="868.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400">照合方法：VA03（受注）→ 環境 → 伝票フローの照会。または VF03（請求）→ ヘッダ → 原始凭证をクリックし、受注伝票までたどって戻れます。「この 3 つの段階が 1 本のチェーンでつながっている」ことを確認してください。</text>
