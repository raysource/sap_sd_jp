<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 620" width="1340" height="620" role="img" aria-label="伝票フローと参照関係（構造図）" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC','Microsoft YaHei',sans-serif">
<title>伝票フローと参照関係（構造図）</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a6ed1"/></marker><marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#007272"/></marker><marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/></marker></defs>
<rect width="1340" height="620" fill="#ffffff"/>
<text x="40.0" y="48.0" font-size="20" fill="#1d2d3e" text-anchor="start" font-weight="700">伝票フロー構造図：どれがどれを参照するか、各伝票がどんなステータスを持つか</text>
<text x="40.0" y="70.0" font-size="13" fill="#6b7a8d" text-anchor="start" font-weight="400">「参照による登録」はデータの一貫性を保証します：数量・価格・得意先が上流から引き継がれます（当サイト自作図）</text>
<rect x="60.0" y="140.0" width="222.0" height="190.0" rx="12" fill="#ffffff" stroke="#0a6ed1" stroke-width="1.4"/>
<rect x="60.0" y="140.0" width="222.0" height="40.0" rx="12" fill="#0a6ed1" stroke="#0a6ed1" stroke-width="1.4"/>
<text x="76.0" y="167.0" font-size="16" fill="#ffffff" text-anchor="start" font-weight="700">引合伝票</text>
<text x="266.0" y="167.0" font-size="12.5" fill="#eaf4ff" text-anchor="end" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">VA11</text>
<text x="76.0" y="206.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400" font-family="'SF Mono',Menlo,Consolas,monospace">伝票タイプ／カテゴリ：IN</text>
<text x="76.0" y="230.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 得意先の意向</text>
<text x="76.0" y="247.0" font-size="12" fill="#354a5f" text-anchor="start" font-weight="400">· 価格拘束なし</text>
<rect x="76.0" y="288.0" width="190.0" height="28.0" rx="7" fill="#f7fafc" stroke="#d9e1e8" stroke-width="1"/>
<text x="86.0" y="307.0" font-size="11.5" fill="#354a5f" text-anchor="start" font-weight="400">全体ステータス</text>
<line x1="286.0" y1="235.0" x2="314.0" y2="235.0" stroke="#0a6ed1" stroke-width="2.2" marker-end="url(#ar)"/>
<text x="278.0" y="222.0" font-size="11.5" fill="#6b7a8d" text-anchor="start" font-weight="400">参照元</text>
